name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            django: "5.2"
            toxenv: py311-django52
          - python: "3.12"
            django: "5.2"
            toxenv: py312-django52
          - python: "3.13"
            django: "5.2"
            toxenv: py313-django52
          - python: "3.14"
            django: "5.2"
            toxenv: py314-django52
          - python: "3.12"
            django: "6.0"
            toxenv: py312-django60
          - python: "3.13"
            django: "6.0"
            toxenv: py313-django60
          - python: "3.14"
            django: "6.0"
            toxenv: py314-django60
          - python: "3.12"
            django: "6.1"
            toxenv: py312-django61
          - python: "3.13"
            django: "6.1"
            toxenv: py313-django61
          - python: "3.14"
            django: "6.1"
            toxenv: py314-django61
          - python: "3.15"
            django: "6.1"
            toxenv: py315-django61
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Run tests
        run: python -m tox -e ${{ matrix.toxenv }}

  lint:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Check lint and formatting
        run: python -m tox -e lint
