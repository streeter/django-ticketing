name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Discover Tox environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Generate test matrix from Tox
        id: matrix
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys

          environments = subprocess.check_output(
              [sys.executable, "-m", "tox", "list", "-d", "--no-desc"], text=True
          ).splitlines()
          jobs = []
          for environment in environments:
              if environment == "lint":
                  continue
              match = re.fullmatch(r"py(\d)(\d+)-.+", environment)
              if match is None:
                  raise ValueError(f"Cannot determine Python version for {environment}")
              mysql = re.search(r"-mysql-(\d+\.\d+)$", environment)
              jobs.append({
                  "python": ".".join(match.groups()),
                  "toxenv": environment,
                  "mysql": mysql.group(1) if mysql else "",
              })
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"matrix={json.dumps({'include': jobs})}", file=output)

  tests:
    name: ${{ matrix.toxenv }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    services:
      mysql:
        image: ${{ matrix.mysql && format('mysql:{0}', matrix.mysql) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ticketing-tests
          MYSQL_DATABASE: ticketing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TICKETING_TEST_DB_PASSWORD: ticketing-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Install MySQL driver build dependencies
        if: matrix.mysql != ''
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Run tests
        run: python -m tox -e ${{ matrix.toxenv }}

  lint:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Check lint and formatting
        run: python -m tox -e lint
