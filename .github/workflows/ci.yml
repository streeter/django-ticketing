name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Discover Tox environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Generate test matrix from Tox
        id: matrix
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import sys

          environments = subprocess.check_output(
              [sys.executable, "-m", "tox", "list", "-d", "--no-desc"], text=True
          ).splitlines()
          jobs = []
          for environment in environments:
              if environment == "lint":
                  continue
              match = re.fullmatch(r"py(\d)(\d+)-.+", environment)
              if match is None:
                  raise ValueError(f"Cannot determine Python version for {environment}")
              jobs.append({"python": ".".join(match.groups()), "toxenv": environment})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"matrix={json.dumps({'include': jobs})}", file=output)

  tests:
    name: ${{ matrix.toxenv }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tox.ini
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Run tests
        run: python -m tox -e ${{ matrix.toxenv }}

  lint:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Tox
        run: python -m pip install "tox>=4.28,<5"
      - name: Check lint and formatting
        run: python -m tox -e lint
