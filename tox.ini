[tox]
requires = tox>=4.28
skip_missing_interpreters = false
# CI discovers these environments and derives Python versions from py<major><minor>.
env_list =
    py{311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    py311-django52-mysql-{8.4,26.10}
    py312-django60-mysql-{8.4,26.10}
    py315-django61-mysql-{8.4,26.10}
    lint

[testenv]
description = Run pytest against {env_name}
package = wheel
wheel_build_env = .pkg
extras = test
change_dir = {env_tmp_dir}
pass_env = TICKETING_TEST_DB_*, TICKETING_TEST_MYSQL_*_PORT
set_env =
    mysql: TICKETING_TEST_MYSQL=1
deps =
    django52: Django>=5.2.8,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    mysql: mysqlclient>=2.2.1
commands = python -m pytest -c {tox_root}/pyproject.toml --import-mode=importlib {tox_root}/ticketing/tests {posargs}

[testenv:lint]
description = Check Python lint and formatting
package = skip
extras =
change_dir = {tox_root}
deps = ruff==0.17.2
commands =
    ruff check .
    ruff format --check .

[testenv:format]
description = Format Python code
package = skip
extras =
change_dir = {tox_root}
deps = ruff==0.17.2
commands = ruff format .
